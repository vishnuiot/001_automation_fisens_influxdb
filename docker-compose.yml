version: '3.8'

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: fisens_influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: fisens
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in your environment or .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: fisens_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in your environment or .env}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  fisens-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fisens_dashboard
    restart: always
    ports:
      - "5000:5000"
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: fisens
      INFLUXDB_BUCKET: sensors
    depends_on:
      - influxdb

volumes:
  influxdb_data:
  grafana_data: